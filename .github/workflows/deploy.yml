name: Deploy redirect stubs

# The guide has MOVED to https://llms.codebycarson.com/working-with-llms/ .
# This Pages deploy no longer publishes the guide itself — it publishes one
# lightweight redirect stub per page so old madebycarson.com/working-with-llms/
# links (including deep links) forward to the new home. The guide SOURCE
# (guide/, mkdocs.yml, hooks/) stays in this repo; the new site's CI builds the
# real guide from it. See tools/build_redirects.py.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Generate redirect stubs
        run: python3 tools/build_redirects.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
